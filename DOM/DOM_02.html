<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making bulb</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Gilroy';
        }
        html,body{
            height:100%;
            width:100%;
            background-color: blueviolet;
        }
        #bulb{
            height:300px;
            width:300px;
            border-radius:50%;
            border:4px solid #000;
        }
    button{
     padding:10px 30px;
     font-size:20px;
     margin:50px;
    }
    </style>
</head>
<body>
    <div id = "bulb"></div>
    <button>ON</button>
</body>
<script>
    let bulb = document.querySelector("#bulb")
   let btn = document.querySelector("button")
   
   let flag = 0
   
   btn.addEventListener("click",function(){
    if(flag == 0 ){
       bulb.style.backgroundColor = "yellow"
       flag = 1
   }
   else{
    bulb.style.backgroundColor = "transparent"
    flag = 0;
   }
   })
</script>
</html>
